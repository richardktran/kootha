apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: kootha
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: user-service
          image: kootha/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: grpc
          envFrom:
            - configMapRef:
                name: kootha-config
          env:
            - name: DB_NAME
              value: users
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            grpc:
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: kootha
spec:
  selector:
    app: user-service
  ports:
    - port: 8082
      targetPort: 8082
      name: grpc
