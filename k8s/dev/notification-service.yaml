apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: kootha
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z redis 6379 && nc -z apache-kafka 9092; do echo waiting; sleep 2; done
      containers:
        - name: notification-service
          image: kootha/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
              name: http
          envFrom:
            - configMapRef:
                name: kootha-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: kootha
spec:
  type: LoadBalancer
  selector:
    app: notification-service
  ports:
    - port: 8086
      targetPort: 8086
      nodePort: 30086
      name: http
