apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-bank-service
  namespace: kootha
  labels:
    app: quiz-bank-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-bank-service
  template:
    metadata:
      labels:
        app: quiz-bank-service
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432 && nc -z redis 6379; do echo waiting; sleep 2; done
      containers:
        - name: quiz-bank-service
          image: kootha/quiz-bank-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: grpc
          envFrom:
            - configMapRef:
                name: kootha-config
          env:
            - name: DB_NAME
              value: quiz_bank
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            grpc:
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-bank-service
  namespace: kootha
spec:
  selector:
    app: quiz-bank-service
  ports:
    - port: 8085
      targetPort: 8085
      name: grpc
