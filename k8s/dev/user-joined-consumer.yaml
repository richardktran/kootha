apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-joined-consumer
  namespace: kootha
  labels:
    app: user-joined-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-joined-consumer
  template:
    metadata:
      labels:
        app: user-joined-consumer
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432 && nc -z apache-kafka 9092; do echo waiting; sleep 2; done
      containers:
        - name: user-joined-consumer
          image: kootha/user-joined-consumer:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kootha-config
          env:
            - name: DB_NAME
              value: quiz_session
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
