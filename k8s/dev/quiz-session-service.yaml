apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-session-service
  namespace: kootha
  labels:
    app: quiz-session-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-session-service
  template:
    metadata:
      labels:
        app: quiz-session-service
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432 && nc -z redis 6379 && nc -z apache-kafka 9092; do echo waiting; sleep 2; done
      containers:
        - name: quiz-session-service
          image: kootha/quiz-session-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: grpc
          envFrom:
            - configMapRef:
                name: kootha-config
          env:
            - name: DB_NAME
              value: quiz_session
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            grpc:
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-session-service
  namespace: kootha
spec:
  selector:
    app: quiz-session-service
  ports:
    - port: 8084
      targetPort: 8084
      name: grpc
