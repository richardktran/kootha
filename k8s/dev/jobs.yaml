apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: kootha
spec:
  backoffLimit: 15
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: migrate
          image: kootha/migrate:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: kootha
spec:
  backoffLimit: 15
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z apache-kafka 9092; do echo waiting for kafka; sleep 2; done"]
      containers:
        - name: kafka-topics
          image: kootha/kafka-topics:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kootha-config
